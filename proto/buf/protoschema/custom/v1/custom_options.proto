// Custom options for the protoschema plugins.
//
// These options allow a schema author to customize the generated JSON Schema.
// The `title` and `description` fields override the corresponding standard JSON
// Schema keywords. `properties` and externally defined extensions inject custom
// vendor extension keywords (e.g. "x-foo"); their keys are written into the
// schema verbatim, so the "x-" prefix should be used to avoid conflicting with
// the standard JSON Schema keywords.
syntax = "proto2";

package buf.protoschema.custom.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/BandlSkyler/protoschema-plugins/gen/proto/buf/protoschema/custom/v1;customv1";
option java_multiple_files = true;
option java_outer_classname = "CustomOptionsProto";
option java_package = "com.buf.protoschema.custom.v1";

// CustomOptions allows customizing the generated JSON Schema.
//
// `title`, `description`, and `default` directly override the schema's
// standard keywords. `properties` is a google.protobuf.Struct whose keys are
// written directly into the schema. `all_of`, `conditional`, and `display_if`
// are structured DSLs that compile to the `allOf`, `if`/`then`/`else`, and
// `x-display-if` keywords respectively. The message is open to extension, so
// external types can embed arbitrary custom keywords via
// `extend buf.protoschema.custom.v1.CustomOptions`.
message CustomOptions {
  // title overrides the generated schema's `title` keyword.
  optional string title = 1;

  // description overrides the generated schema's `description` keyword.
  optional string description = 2;

  // default overrides the generated schema's `default` keyword. It is a
  // google.protobuf.Value, so any JSON value can be expressed (number, string,
  // bool, null, object, or array).
  optional google.protobuf.Value default = 3;

  // properties is the set of custom keywords to inject into the schema.
  optional google.protobuf.Struct properties = 4;

  // all_of is a list of constraint groups. Each group compiles to one member
  // of the generated schema's `allOf` array and must hold in addition to the
  // sibling keywords of the schema.
  repeated Constraints all_of = 5;

  // conditional is a structured if/then/else. When the `if` conditions match,
  // `then` applies, otherwise `else` applies.
  optional Conditional conditional = 6;

  // display_if is a visibility hint for UI layers. It compiles to the
  // `x-display-if` vendor keyword on the schema of a field or message.
  optional Condition display_if = 7;

  // permission_level is a shorthand for the `x-permission-level` vendor
  // keyword. It declares the minimum role level required to edit the field
  // (1 / 2 / 3); the value 0 or an unset field emits nothing.
  optional int32 permission_level = 8;

  // datasource is a shorthand for the `x-datasource` vendor keyword. Its value
  // is a data source id followed by an optional URL-query-style parameter
  // template, e.g. "item_catalog?pool_id={../pool_id}".
  optional string datasource = 9;

  // items_from is a shorthand for the `x-items-from` vendor keyword. Its value
  // is a document-internal reference of the form "path|valueField|labelField",
  // e.g. "#/module/tg_backpack/item_groups/*/items/*|item_id|name".
  optional string items_from = 10;

  // renderer is a shorthand for the `x-renderer` vendor keyword. It selects
  // the UI component used to render the field (e.g. "oss", "richtext").
  optional string renderer = 11;

  // examples is a shorthand for the standard JSON Schema `examples` keyword
  // (Draft-07, an array of example values).
  repeated google.protobuf.Value examples = 12;

  // enum is a shorthand for the standard JSON Schema `enum` keyword. It lists
  // the set of allowed values for the field.
  repeated google.protobuf.Value enum = 13;

  // unique_items is a shorthand for the standard JSON Schema `uniqueItems`
  // keyword. When true, array elements must be unique.
  optional bool unique_items = 14;

  // unique_item_properties is a shorthand for the vendor `uniqueItemProperties`
  // keyword: the list of property names that must be unique across the
  // elements of an array (used by the ajv-based frontend).
  repeated string unique_item_properties = 15;

  // format is a shorthand for the standard JSON Schema `format` keyword
  // (e.g. "uri", "date-time", "email").
  optional string format = 16;

  // Reserve a range for external extension types. Each extension's message is
  // serialized to JSON and its keys are injected into the schema.
  extensions 100 to max;
}

// Constraints is a group of schema constraints that compile to one JSON Schema
// fragment.
message Constraints {
  // required lists field names that must be present:
  // {"required": [...]}
  repeated string required = 1;

  // field_constraints applies per-field constraints:
  // {"properties": {field: {"minItems": n, "const": value}}}
  repeated FieldConstraint field_constraints = 2;

  // properties is the set of arbitrary JSON Schema keywords injected
  // verbatim into the fragment.
  optional google.protobuf.Struct properties = 3;
}

// FieldConstraint applies constraints to a single field.
message FieldConstraint {
  // field is the field name (dotted path not required; matches the schema's
  // property key).
  optional string field = 1;

  // min_items requires an array field to have at least this many items.
  optional uint64 min_items = 2;

  // const requires the field value to equal this constant. Any JSON value can
  // be expressed.
  optional google.protobuf.Value const = 3;
}

// Conditional is a structured if/then/else.
message Conditional {
  // if lists the conditions that must all match for `then` to apply.
  repeated Condition if = 1;

  // then applies when all `if` conditions match.
  optional Constraints then = 2;

  // else applies when any `if` condition fails.
  optional Constraints else = 3;
}

// Condition describes a predicate on a field.
message Condition {
  // field is the dotted path of the field, e.g. "base.enabled".
  optional string field = 1;

  // exists requires the field to be present.
  optional bool exists = 2;

  // equals requires the field value to equal the given constant. Exactly one
  // of the equals_* alternatives should be set.
  oneof equals {
    // equals_bool requires the field to equal this boolean.
    bool equals_bool = 3;
    // equals_int requires the field to equal this integer.
    int64 equals_int = 4;
    // equals_string requires the field to equal this string.
    string equals_string = 5;
    // equals_value requires the field to equal this arbitrary JSON value.
    google.protobuf.Value equals_value = 6;
  }
}

extend google.protobuf.MessageOptions {
  // message_options injects custom keywords into the schema generated for a
  // message.
  optional CustomOptions message_options = 50000;
}

extend google.protobuf.FieldOptions {
  // field_options injects custom keywords into the schema generated for a
  // field.
  optional CustomOptions field_options = 50001;
}
