// Custom options for the protoschema plugins.
//
// These options allow a schema author to inject custom vendor extension
// keywords (e.g. "x-foo") into the generated JSON Schema. The keys are written
// into the schema verbatim, so the "x-" prefix should be used to avoid
// conflicting with the standard JSON Schema keywords.
syntax = "proto2";

package buf.protoschema.custom.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";

// CustomOptions contains arbitrary JSON Schema extension properties.
//
// The properties field is a google.protobuf.Struct whose keys are written
// directly into the generated JSON Schema object.
message CustomOptions {
  // properties is the set of custom keywords to inject into the schema.
  optional google.protobuf.Struct properties = 1;
}

extend google.protobuf.MessageOptions {
  // message_options injects custom keywords into the schema generated for a
  // message.
  optional CustomOptions message_options = 50000;
}

extend google.protobuf.FieldOptions {
  // field_options injects custom keywords into the schema generated for a
  // field.
  optional CustomOptions field_options = 50001;
}
