// External extension types for buf.protoschema.custom.v1.CustomOptions.
//
// proto3 only allows extending descriptor options, so external extension types
// must be declared in a proto2 file.
syntax = "proto2";

package buf.protoschema.test.v1;

import "buf/protoschema/custom/v1/custom_options.proto";

// VendorExt is an external extension type injected into the generated JSON
// Schema. Its serialized JSON is merged into the schema of the message or field
// that carries the extension.
message VendorExt {
  optional string entity = 1;
  repeated string tags = 2;
}

extend buf.protoschema.custom.v1.CustomOptions {
  // vendor injects the VendorExt properties into the generated schema.
  optional VendorExt vendor = 100;
}
